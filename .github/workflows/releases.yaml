name: Build & Publish Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to publish (e.g. v3.5.1)'
        required: true
        default: 'v3.5.1'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 (GUI + Web + CLI + Prism SFX)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Resolve Version String
        shell: pwsh
        run: |
          $rawTag = if ("${{ github.event.inputs.tag_name }}" -ne "") {
            "${{ github.event.inputs.tag_name }}"
          } else {
            "${{ github.ref_name }}"
          }
          $ver = $rawTag -replace '^v', ''
          "TAG_NAME=$rawTag" | Out-File -FilePath $env:GITHUB_ENV -Append
          "APP_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Fetch Workspace Dependencies & Run Tests
        shell: pwsh
        run: |
          Push-Location apps/agent_mcp_app; flutter pub get; Pop-Location
          dart analyze packages/agent_mcp_core
          Push-Location packages/agent_mcp_core
          dart test
          Pop-Location
          Push-Location apps/agent_mcp_app
          flutter test --no-pub
          Pop-Location

      - name: Compile Web Dashboard, Windows Desktop & Standalone CLI
        shell: pwsh
        run: |
          Push-Location apps/agent_mcp_app
          flutter build web --release --base-href /dashboard/ --no-pub
          flutter build windows --release --no-pub
          Pop-Location
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          dart compile exe packages/agent_mcp_core/bin/agent_mcp.dart -o bin/agent-mcp.exe

      - name: Package Portable ZIP, Prism SFX Installer & Standalone CLI ZIP
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\package_sfx.ps1 -SkipBuild -Version $env:APP_VERSION
          New-Item -ItemType Directory -Force -Path release\_cli_stage\web_dashboard | Out-Null
          Copy-Item -Force bin\agent-mcp.exe release\_cli_stage\agent-mcp.exe
          Copy-Item -Recurse -Force apps\agent_mcp_app\build\web\* release\_cli_stage\web_dashboard\
          Copy-Item -Force LICENSE, README.md, README.en.md release\_cli_stage\
          Compress-Archive -Path release\_cli_stage\* -DestinationPath "release\AgentMCP-v$($env:APP_VERSION)-windows-x64-cli.zip" -Force
          Remove-Item -Recurse -Force release\_cli_stage

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-artifacts
          path: |
            release/AgentMCP-v*-windows-x64-sfx.exe
            release/AgentMCP-v*-windows-x64-portable.zip
            release/AgentMCP-v*-windows-x64-cli.zip
          if-no-files-found: error

  build-android:
    name: Build Android Multi-ABI APKs (arm64-v8a / armeabi-v7a / x86_64 / Universal)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Resolve Version String
        run: |
          RAW_TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          VER="${RAW_TAG#v}"
          echo "TAG_NAME=${RAW_TAG}" >> "$GITHUB_ENV"
          echo "APP_VERSION=${VER}" >> "$GITHUB_ENV"

      - name: Setup Java 21 (Required by Gradle 9 / AGP 9)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Universal & Split-ABI Release APKs
        run: |
          (cd apps/agent_mcp_app && flutter pub get)
          mkdir -p release
          cd apps/agent_mcp_app
          flutter build apk --release --no-pub
          cp build/app/outputs/flutter-apk/app-release.apk "../../release/AgentMCP-v${APP_VERSION}-android-universal.apk"
          flutter build apk --release --split-per-abi --no-pub
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "../../release/AgentMCP-v${APP_VERSION}-android-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "../../release/AgentMCP-v${APP_VERSION}-android-armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk "../../release/AgentMCP-v${APP_VERSION}-android-x86_64.apk"

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-artifacts
          path: |
            release/AgentMCP-v*-android-arm64-v8a.apk
            release/AgentMCP-v*-android-armeabi-v7a.apk
            release/AgentMCP-v*-android-x86_64.apk
            release/AgentMCP-v*-android-universal.apk
          if-no-files-found: error

  build-linux-x64:
    name: Build Linux x64 (GTK3 Desktop GUI + CLI + Web Bundle)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Resolve Version String
        run: |
          RAW_TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          VER="${RAW_TAG#v}"
          echo "APP_VERSION=${VER}" >> "$GITHUB_ENV"

      - name: Install Linux GTK3 Desktop Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Setup Flutter & Dart SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Compile Linux x64 GTK3 GUI, CLI Binary & Web Dashboard
        run: |
          (cd apps/agent_mcp_app && flutter pub get)
          pushd apps/agent_mcp_app
          flutter build web --release --base-href /dashboard/ --no-pub
          flutter build linux --release --no-pub
          popd
          mkdir -p release stage_linux/web_dashboard stage_linux_gui/web_dashboard
          dart compile exe packages/agent_mcp_core/bin/agent_mcp.dart -o stage_linux/agent-mcp
          chmod +x stage_linux/agent-mcp
          cp -r apps/agent_mcp_app/build/web/. stage_linux/web_dashboard/
          cp LICENSE README.md README.en.md stage_linux/
          tar -czf "release/AgentMCP-v${APP_VERSION}-linux-x64-cli.tar.gz" -C stage_linux .

          # Assemble Portable Linux x64 GUI Bundle (GTK3 App + CLI + Web Dashboard + .desktop installer)
          cp -r apps/agent_mcp_app/build/linux/x64/release/bundle/. stage_linux_gui/
          cp stage_linux/agent-mcp stage_linux_gui/agent-mcp
          chmod +x stage_linux_gui/agent_mcp_app stage_linux_gui/agent-mcp
          cp -r apps/agent_mcp_app/build/web/. stage_linux_gui/web_dashboard/
          cp apps/agent_mcp_app/assets/app_icon.png stage_linux_gui/app_icon.png
          cp LICENSE README.md README.en.md stage_linux_gui/
          cat << 'DESKEOF' > stage_linux_gui/install-desktop.sh
          #!/usr/bin/env bash
          set -euo pipefail
          APP_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          mkdir -p "$HOME/.local/share/applications" "$HOME/.local/bin"
          ln -sf "$APP_DIR/agent-mcp" "$HOME/.local/bin/agent-mcp"
          cat > "$HOME/.local/share/applications/agent-mcp.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=Agent MCP Console
          Comment=Concentric Liquid Prism MCP Control Plane & Gateway
          Exec="$APP_DIR/agent_mcp_app"
          Icon=$APP_DIR/app_icon.png
          Terminal=false
          Categories=Development;Utility;
          StartupWMClass=io.github.iamr0s.agent_mcp_app
          EOF
          chmod +x "$HOME/.local/share/applications/agent-mcp.desktop"
          echo "[OK] Installed Agent MCP Console launcher & ~/.local/bin/agent-mcp"
          DESKEOF
          chmod +x stage_linux_gui/install-desktop.sh
          tar -czf "release/AgentMCP-v${APP_VERSION}-linux-x64-gui.tar.gz" -C stage_linux_gui .

      - name: Upload Linux x64 GUI & CLI Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-artifacts
          path: |
            release/AgentMCP-v*-linux-x64-gui.tar.gz
            release/AgentMCP-v*-linux-x64-cli.tar.gz
          if-no-files-found: error

      - name: Upload Reusable Web Dashboard Bundle
        uses: actions/upload-artifact@v4
        with:
          name: web-dashboard-bundle
          path: apps/agent_mcp_app/build/web
          if-no-files-found: error

  build-linux-arm64:
    name: Build Linux ARM64 (GTK3 Desktop GUI + CLI Bundle)
    needs: [build-linux-x64]
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Resolve Version String
        run: |
          RAW_TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          VER="${RAW_TAG#v}"
          echo "APP_VERSION=${VER}" >> "$GITHUB_ENV"

      - name: Install Linux ARM64 GTK3 Desktop Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Setup Flutter & Dart SDK (Native ARM64)
        run: |
          sudo apt-get install -y curl git unzip xz-utils zip libglu1-mesa
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version
          "$RUNNER_TEMP/flutter/bin/flutter" config --enable-linux-desktop

      - name: Download Reusable Web Dashboard Bundle
        uses: actions/download-artifact@v4
        with:
          name: web-dashboard-bundle
          path: stage_linux/web_dashboard

      - name: Compile Native Linux ARM64 GTK3 GUI & CLI Binary
        run: |
          (cd apps/agent_mcp_app && flutter pub get)
          pushd apps/agent_mcp_app
          flutter build linux --release --no-pub
          popd
          mkdir -p release stage_linux/web_dashboard stage_linux_gui/web_dashboard
          dart compile exe packages/agent_mcp_core/bin/agent_mcp.dart -o stage_linux/agent-mcp
          chmod +x stage_linux/agent-mcp
          cp LICENSE README.md README.en.md stage_linux/
          tar -czf "release/AgentMCP-v${APP_VERSION}-linux-arm64-cli.tar.gz" -C stage_linux .

          cp -r apps/agent_mcp_app/build/linux/arm64/release/bundle/. stage_linux_gui/
          cp stage_linux/agent-mcp stage_linux_gui/agent-mcp
          chmod +x stage_linux_gui/agent_mcp_app stage_linux_gui/agent-mcp
          cp -r stage_linux/web_dashboard/. stage_linux_gui/web_dashboard/
          cp apps/agent_mcp_app/assets/app_icon.png stage_linux_gui/app_icon.png
          cp LICENSE README.md README.en.md stage_linux_gui/
          cat << 'DESKEOF' > stage_linux_gui/install-desktop.sh
          #!/usr/bin/env bash
          set -euo pipefail
          APP_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          mkdir -p "$HOME/.local/share/applications" "$HOME/.local/bin"
          ln -sf "$APP_DIR/agent-mcp" "$HOME/.local/bin/agent-mcp"
          cat > "$HOME/.local/share/applications/agent-mcp.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=Agent MCP Console
          Comment=Concentric Liquid Prism MCP Control Plane & Gateway
          Exec="$APP_DIR/agent_mcp_app"
          Icon=$APP_DIR/app_icon.png
          Terminal=false
          Categories=Development;Utility;
          StartupWMClass=io.github.iamr0s.agent_mcp_app
          EOF
          chmod +x "$HOME/.local/share/applications/agent-mcp.desktop"
          echo "[OK] Installed Agent MCP Console launcher & ~/.local/bin/agent-mcp"
          DESKEOF
          chmod +x stage_linux_gui/install-desktop.sh
          tar -czf "release/AgentMCP-v${APP_VERSION}-linux-arm64-gui.tar.gz" -C stage_linux_gui .

      - name: Upload Linux ARM64 GUI & CLI Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-artifacts
          path: |
            release/AgentMCP-v*-linux-arm64-gui.tar.gz
            release/AgentMCP-v*-linux-arm64-cli.tar.gz
          if-no-files-found: error

  build-windows-arm64:
    name: Build Windows ARM64 Server & CLI Bundle (with Web Dashboard)
    needs: [build-linux-x64]
    runs-on: windows-11-arm
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Resolve Version String
        shell: pwsh
        run: |
          $rawTag = "${{ github.event.inputs.tag_name || github.ref_name }}"
          $ver = $rawTag.TrimStart('v')
          "APP_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Setup Dart SDK (Native Windows ARM64)
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Download Reusable Web Dashboard Bundle
        uses: actions/download-artifact@v4
        with:
          name: web-dashboard-bundle
          path: stage_win_arm64/web_dashboard

      - name: Compile Native Windows ARM64 Server Binary
        shell: pwsh
        run: |
          (Get-Content 'packages/agent_mcp_core/pubspec.yaml' | Where-Object { $_ -notmatch '^resolution:' }) | Set-Content 'packages/agent_mcp_core/pubspec.yaml' -Encoding UTF8
          Push-Location packages/agent_mcp_core
          dart pub get
          Pop-Location
          New-Item -ItemType Directory -Force -Path release, stage_win_arm64 | Out-Null
          dart compile exe packages/agent_mcp_core/bin/agent_mcp.dart -o stage_win_arm64/agent-mcp.exe
          Copy-Item LICENSE, README.md, README.en.md stage_win_arm64/
          Compress-Archive -Path stage_win_arm64/* -DestinationPath "release/AgentMCP-v$($env:APP_VERSION)-windows-arm64-cli.zip" -Force

      - name: Upload Windows ARM64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-arm64-cli-artifact
          path: release/AgentMCP-v*-windows-arm64-cli.zip
          if-no-files-found: error

  build-macos-arm64:
    name: Build macOS ARM64 (Apple Silicon) DMG + App + CLI
    needs: [build-linux-x64]
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Resolve Version String
        run: |
          RAW_TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          VER="${RAW_TAG#v}"
          echo "APP_VERSION=${VER}" >> "$GITHUB_ENV"

      - name: Setup Flutter & Dart SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Download Reusable Web Dashboard Bundle
        uses: actions/download-artifact@v4
        with:
          name: web-dashboard-bundle
          path: stage_macos/web_dashboard

      - name: Compile macOS ARM64 GUI (.dmg + .app.zip) & CLI Bundle
        run: |
          (cd apps/agent_mcp_app && flutter pub get)
          pushd apps/agent_mcp_app
          flutter build macos --release --no-pub
          popd
          mkdir -p release stage_macos/web_dashboard
          dart compile exe packages/agent_mcp_core/bin/agent_mcp.dart -o stage_macos/agent-mcp
          chmod +x stage_macos/agent-mcp
          cp LICENSE README.md README.en.md stage_macos/
          tar -czf "release/AgentMCP-v${APP_VERSION}-macos-arm64-cli.tar.gz" -C stage_macos .

          # Embed web_dashboard & agent-mcp CLI inside Agent MCP.app/Contents/Resources and ad-hoc re-sign
          BUILD_REL="apps/agent_mcp_app/build/macos/Build/Products/Release"
          SRC_APP=$(ls -d "$BUILD_REL"/*.app | head -n 1)
          mkdir -p dmg_stage
          cp -R "$SRC_APP" "dmg_stage/Agent MCP.app"
          mkdir -p "dmg_stage/Agent MCP.app/Contents/Resources/web_dashboard"
          cp -R stage_macos/web_dashboard/. "dmg_stage/Agent MCP.app/Contents/Resources/web_dashboard/"
          cp stage_macos/agent-mcp "dmg_stage/Agent MCP.app/Contents/MacOS/agent-mcp"
          chmod +x "dmg_stage/Agent MCP.app/Contents/MacOS/agent-mcp"
          codesign --force --deep --sign - "dmg_stage/Agent MCP.app"

          ditto -c -k --sequesterRsrc --keepParent "dmg_stage/Agent MCP.app" "release/AgentMCP-v${APP_VERSION}-macos-arm64-app.zip"
          ln -s /Applications dmg_stage/Applications
          hdiutil create -volname "Agent MCP v${APP_VERSION}" -srcfolder dmg_stage -ov -format UDZO "release/AgentMCP-v${APP_VERSION}-macos-arm64.dmg"

      - name: Upload macOS ARM64 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-artifacts
          path: |
            release/AgentMCP-v*-macos-arm64.dmg
            release/AgentMCP-v*-macos-arm64-app.zip
            release/AgentMCP-v*-macos-arm64-cli.tar.gz
          if-no-files-found: error

  build-macos-x64:
    name: Build macOS Intel (x64) DMG + App + CLI
    needs: [build-linux-x64]
    runs-on: macos-15-intel
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Resolve Version String
        run: |
          RAW_TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          VER="${RAW_TAG#v}"
          echo "APP_VERSION=${VER}" >> "$GITHUB_ENV"

      - name: Setup Flutter & Dart SDK (macOS Intel x64)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Download Reusable Web Dashboard Bundle
        uses: actions/download-artifact@v4
        with:
          name: web-dashboard-bundle
          path: stage_macos_x64/web_dashboard

      - name: Compile macOS Intel x64 GUI (.dmg + .app.zip) & CLI Bundle
        run: |
          (cd apps/agent_mcp_app && flutter pub get)
          pushd apps/agent_mcp_app
          flutter build macos --release --no-pub
          popd
          mkdir -p release stage_macos_x64/web_dashboard
          dart compile exe packages/agent_mcp_core/bin/agent_mcp.dart -o stage_macos_x64/agent-mcp
          chmod +x stage_macos_x64/agent-mcp
          cp LICENSE README.md README.en.md stage_macos_x64/
          tar -czf "release/AgentMCP-v${APP_VERSION}-macos-x64-cli.tar.gz" -C stage_macos_x64 .

          BUILD_REL="apps/agent_mcp_app/build/macos/Build/Products/Release"
          SRC_APP=$(ls -d "$BUILD_REL"/*.app | head -n 1)
          mkdir -p dmg_stage_x64
          cp -R "$SRC_APP" "dmg_stage_x64/Agent MCP.app"
          mkdir -p "dmg_stage_x64/Agent MCP.app/Contents/Resources/web_dashboard"
          cp -R stage_macos_x64/web_dashboard/. "dmg_stage_x64/Agent MCP.app/Contents/Resources/web_dashboard/"
          cp stage_macos_x64/agent-mcp "dmg_stage_x64/Agent MCP.app/Contents/MacOS/agent-mcp"
          chmod +x "dmg_stage_x64/Agent MCP.app/Contents/MacOS/agent-mcp"
          codesign --force --deep --sign - "dmg_stage_x64/Agent MCP.app"

          ditto -c -k --sequesterRsrc --keepParent "dmg_stage_x64/Agent MCP.app" "release/AgentMCP-v${APP_VERSION}-macos-x64-app.zip"
          ln -s /Applications dmg_stage_x64/Applications
          hdiutil create -volname "Agent MCP v${APP_VERSION}" -srcfolder dmg_stage_x64 -ov -format UDZO "release/AgentMCP-v${APP_VERSION}-macos-x64.dmg"

      - name: Upload macOS Intel x64 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-x64-artifacts
          path: |
            release/AgentMCP-v*-macos-x64.dmg
            release/AgentMCP-v*-macos-x64-app.zip
            release/AgentMCP-v*-macos-x64-cli.tar.gz
          if-no-files-found: error

  publish-release:
    name: Publish Multi-Platform GitHub Release & Dynamic version.json
    needs: [build-windows, build-windows-arm64, build-android, build-linux-x64, build-linux-arm64, build-macos-arm64, build-macos-x64]
    if: always() && needs.build-windows.result == 'success' && needs.build-android.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository with Full Tag & Commit History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download All Release Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*-artifact*'
          path: dist_artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        working-directory: dist_artifacts
        run: |
          sha256sum AgentMCP-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Generate Dynamic Release Notes & version.json Manifest
        id: gen_meta
        env:
          REL_TAG: ${{ github.event.inputs.tag_name || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PYEOF'
          import datetime, hashlib, json, os, pathlib, re, subprocess

          tag = os.environ['REL_TAG'].strip()
          ver = tag.lstrip('vV')
          repo = os.environ['REPO'].strip()
          dist = pathlib.Path('dist_artifacts')

          suffix_map = {
              '-windows-x64-sfx.exe': 'windows_sfx',
              '-windows-x64-portable.zip': 'windows_portable',
              '-windows-x64-cli.zip': 'windows_cli',
              '-windows-arm64-cli.zip': 'windows_arm64_cli',
              '-macos-arm64.dmg': 'macos_arm64_dmg',
              '-macos-arm64-app.zip': 'macos_arm64_app',
              '-macos-arm64-cli.tar.gz': 'macos_arm64_cli',
              '-macos-x64.dmg': 'macos_x64_dmg',
              '-macos-x64-app.zip': 'macos_x64_app',
              '-macos-x64-cli.tar.gz': 'macos_x64_cli',
              '-linux-x64-gui.tar.gz': 'linux_x64_gui',
              '-linux-x64-cli.tar.gz': 'linux_x64_cli',
              '-linux-arm64-gui.tar.gz': 'linux_arm64_gui',
              '-linux-arm64-cli.tar.gz': 'linux_arm64_cli',
              '-android-arm64-v8a.apk': 'android_arm64',
              '-android-armeabi-v7a.apk': 'android_armv7',
              '-android-x86_64.apk': 'android_x86_64',
              '-android-universal.apk': 'android_universal',
          }

          assets = {}
          for f in sorted(dist.glob('AgentMCP-*')):
              if not f.is_file():
                  continue
              name = f.name
              low = name.lower()
              key = None
              for suf, k in suffix_map.items():
                  if low.endswith(suf):
                      key = k
                      break
              if key is None:
                  continue
              h = hashlib.sha256()
              with f.open('rb') as fp:
                  for chunk in iter(lambda: fp.read(65536), b''):
                      h.update(chunk)
              assets[key] = {
                  'name': name,
                  'url': f'https://github.com/{repo}/releases/download/{tag}/{name}',
                  'sha256': h.hexdigest(),
                  'size': f.stat().st_size,
              }

          # 1. Extract release title & structured notes dynamically:
          #    Priority A: CHANGELOG.md section for [vX.Y.Z] / vX.Y.Z
          #    Priority B: Annotated git tag message
          #    Priority C: Git commit log since previous v* tag
          release_title = f'Agent MCP {tag}'
          notes_body = ''

          changelog_path = pathlib.Path('CHANGELOG.md')
          if changelog_path.is_file():
              raw_cl = changelog_path.read_text(encoding='utf-8')
              pat = re.compile(
                  rf'^##\s+\[?v?{re.escape(ver)}\]?(?:\s*[—\-:]\s*(.+))?$\n(.*?)(?=^##\s+|\Z)',
                  re.MULTILINE | re.DOTALL,
              )
              m = pat.search(raw_cl)
              if m:
                  subtitle = (m.group(1) or '').strip()
                  if subtitle:
                      release_title = f'Agent MCP {tag} — {subtitle}'
                  notes_body = m.group(2).strip()

          if not notes_body:
              try:
                  tag_msg = subprocess.check_output(
                      ['git', 'for-each-ref', f'refs/tags/{tag}', '--format=%(contents)'],
                      text=True,
                  ).strip()
                  if tag_msg:
                      lines = [ln.rstrip() for ln in tag_msg.splitlines()]
                      first = lines[0].strip()
                      rest = '\n'.join(lines[1:]).strip()
                      if first:
                          release_title = first if first.lower().startswith('agent mcp') else f'Agent MCP {tag} — {first}'
                      notes_body = rest or first
              except Exception:
                  pass

          if not notes_body:
              try:
                  tags_out = subprocess.check_output(
                      ['git', 'tag', '--sort=-creatordate', '-l', 'v*'],
                      text=True,
                  ).splitlines()
                  prev_tag = next((t.strip() for t in tags_out if t.strip() and t.strip() != tag), '')
                  rev_range = f'{prev_tag}..{tag}' if prev_tag else f'{tag}~8..{tag}'
                  commits = subprocess.check_output(
                      ['git', 'log', rev_range, '--no-merges', '--pretty=format:- %s (`%h`)'],
                      text=True,
                  ).strip()
                  if commits:
                      notes_body = commits
              except Exception:
                  pass

          if not notes_body:
              notes_body = f'- Agent MCP {tag} 全平台桌面 GUI、移动端与 CLI 正式版更新。'

          # Build clean Markdown Release Body with Download Matrix Table
          ver_parts = [int(p) if p.isdigit() else 0 for p in (ver.split('.') + ['0', '0', '0'])[:3]]
          build_num = ver_parts[0] * 1000 + ver_parts[1] * 100 + ver_parts[2]

          manifest = {
              'version': ver,
              'tag': tag,
              'build': build_num,
              'published_at': datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
              'release_url': f'https://github.com/{repo}/releases/tag/{tag}',
              'notes': f'{release_title}\n{notes_body}',
              'assets': assets,
          }
          out = dist / 'version.json'
          out.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          rows = [
              ('Windows x64 桌面安装向导 (Prism GUI)', 'windows_sfx'),
              ('Windows x64 免安装绿色版 (GUI + CLI)', 'windows_portable'),
              ('macOS Apple Silicon 桌面版 (.dmg)', 'macos_arm64_dmg'),
              ('macOS Intel 桌面版 (.dmg)', 'macos_x64_dmg'),
              ('Linux x64 桌面版 (GTK3 GUI + CLI)', 'linux_x64_gui'),
              ('Linux ARM64 桌面版 (GTK3 GUI + CLI)', 'linux_arm64_gui'),
              ('Android 手机端推荐版 (arm64-v8a APK)', 'android_arm64'),
              ('Android 全架构通用版 (Universal APK)', 'android_universal'),
          ]
          table_lines = [
              '### 全平台安装包速览',
              '',
              '| 平台与形态 | 安装包文件 | 大小 |',
              '| :--- | :--- | :--- |',
          ]
          for label, k in rows:
              a = assets.get(k)
              if not a:
                  continue
              mb = a['size'] / (1024 * 1024)
              table_lines.append(f"| {label} | [`{a['name']}`]({a['url']}) | {mb:.2f} MB |")

          full_md = f"## 更新亮点\n\n{notes_body}\n\n" + '\n'.join(table_lines) + '\n'
          pathlib.Path('release_notes.md').write_text(full_md, encoding='utf-8')

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as gh_out:
              gh_out.write(f'release_title={release_title}\n')
          print('=== RELEASE TITLE ===\n' + release_title)
          print('=== RELEASE NOTES ===\n' + full_md)
          PYEOF

      - name: Publish GitHub Release with Dynamic Changelog & Multi-Platform Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: ${{ steps.gen_meta.outputs.release_title }}
          body_path: release_notes.md
          generate_release_notes: true
          files: |
            dist_artifacts/AgentMCP-*
            dist_artifacts/SHA256SUMS.txt
            dist_artifacts/version.json
