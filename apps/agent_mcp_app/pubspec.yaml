name: agent_mcp_app
description: Anthropic Editorial-Style Desktop & Web Console for Agent MCP
publish_to: none
version: 2.0.0+2

resolution: workspace

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  agent_mcp_core:
    path: ../../packages/agent_mcp_core
  http: ^1.2.2
  path: ^1.9.1
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.ico
  fonts:
    - family: AnthropicSerif
      fonts:
        - asset: assets/fonts/AnthropicSerif-Regular.ttf
          weight: 400
        - asset: assets/fonts/AnthropicSerif-Medium.ttf
          weight: 500
        - asset: assets/fonts/AnthropicSerif-Medium.ttf
          weight: 600
    - family: AnthropicSans
      fonts:
        - asset: assets/fonts/AnthropicSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/AnthropicSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/AnthropicSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/AnthropicSans-SemiBold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/JetBrainsMono-SemiBold.ttf
          weight: 700
    - family: NotoSerifSC
      fonts:
        - asset: assets/fonts/NotoSerifSC-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSerifSC-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSerifSC-Medium.ttf
          weight: 600
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansSC-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansSC-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansSC-SemiBold.ttf
          weight: 700
