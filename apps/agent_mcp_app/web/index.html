<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Agent MCP Console — Cross-Device Remote Execution & MCP Control Plane">
  <meta name="theme-color" content="#FAFAFB" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0A0A0C" media="(prefers-color-scheme: dark)">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Agent MCP">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <link rel="preload" href="assets/assets/fonts/AnthropicSans-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="assets/assets/fonts/JetBrainsMono-Regular.ttf" as="font" type="font/ttf" crossorigin>

  <title>Agent MCP Console</title>

  <style>
    :root {
      --outer: #FAFAFB;
      --card: #FFFFFF;
      --well: #F4F4F6;
      --line: rgba(17, 17, 19, 0.085);
      --ink: #111113;
      --muted: #71717A;
      --accent: #141416;
      --accent-soft: #27272A;
      --accent-tint: rgba(20, 20, 22, 0.075);
      --dot: rgba(17, 17, 19, 0.055);
      --shadow: inset 0 1px 0 rgba(255, 255, 255, 0.96), 0 18px 42px -12px rgba(9, 9, 11, 0.09), 0 2px 6px rgba(9, 9, 11, 0.035);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --outer: #0A0A0C;
        --card: #121216;
        --well: #0E0E12;
        --line: rgba(255, 255, 255, 0.09);
        --ink: #FAFAFA;
        --muted: #8E8E98;
        --accent: #F4F4F6;
        --accent-soft: #FFFFFF;
        --accent-tint: rgba(244, 244, 246, 0.10);
        --dot: rgba(250, 250, 250, 0.045);
        --shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14), 0 22px 48px -10px rgba(0, 0, 0, 0.72), 0 2px 8px rgba(0, 0, 0, 0.44);
      }
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: var(--outer);
      color: var(--ink);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    #mcp-boot {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background-color: var(--outer);
      background-image:
        radial-gradient(560px 360px at 50% 42%, var(--accent-tint), transparent 72%),
        radial-gradient(circle, var(--dot) 1px, transparent 1px);
      background-size: 100% 100%, 22px 22px;
      transition: opacity 260ms cubic-bezier(0.16, 1, 0.3, 1), filter 260ms cubic-bezier(0.16, 1, 0.3, 1), transform 260ms cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }
    #mcp-boot.done {
      opacity: 0;
      filter: blur(4px);
      transform: scale(1.015);
    }
    .boot-card {
      width: 100%;
      max-width: 316px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 22px 22px 18px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 14px;
      animation: cardEnter 240ms cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    .boot-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .boot-brand {
      display: flex;
      align-items: center;
      gap: 11px;
    }
    .boot-mark {
      position: relative;
      width: 36px;
      height: 36px;
      border-radius: 9.5px;
      background: var(--well);
      border: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .boot-orbit {
      position: absolute;
      inset: -1px;
      width: calc(100% + 2px);
      height: calc(100% + 2px);
      pointer-events: none;
    }
    .boot-orbit rect {
      fill: none;
      stroke: var(--accent-soft);
      stroke-width: 1.5;
      stroke-dasharray: 36 112;
      animation: orbitTrace 1.6s linear infinite;
    }
    .boot-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", "PingFang SC", "Microsoft YaHei UI", sans-serif;
      font-size: 14.5px;
      font-weight: 600;
      letter-spacing: -0.015em;
      color: var(--ink);
      line-height: 1.25;
    }
    .boot-tag {
      font-family: ui-monospace, "JetBrains Mono", SFMono-Regular, Consolas, monospace;
      font-size: 10.5px;
      font-weight: 600;
      padding: 2.5px 7px;
      border-radius: 6px;
      background: var(--accent-tint);
      color: var(--accent-soft);
      letter-spacing: 0.02em;
    }
    .boot-bar {
      width: 100%;
      height: 2px;
      border-radius: 99px;
      background: var(--line);
      overflow: hidden;
      position: relative;
    }
    .boot-bar-fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: 38%;
      border-radius: 99px;
      background: linear-gradient(90deg, transparent, var(--accent), var(--accent-soft), transparent);
      animation: beamSlide 1.25s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .boot-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei UI", sans-serif;
      font-size: 12px;
      color: var(--muted);
    }
    .boot-step {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }
    .boot-dot {
      width: 6px;
      height: 6px;
      border-radius: 99px;
      background: var(--accent);
      flex-shrink: 0;
      animation: dotPulse 1.4s ease-in-out infinite;
    }
    .boot-elapsed {
      font-family: ui-monospace, "JetBrains Mono", SFMono-Regular, Consolas, monospace;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      opacity: 0.8;
    }
    @keyframes cardEnter {
      from { opacity: 0; transform: translateY(6px) scale(0.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes orbitTrace {
      from { stroke-dashoffset: 148; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes beamSlide {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(270%); }
    }
    @keyframes dotPulse {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="mcp-boot">
    <div class="boot-card">
      <div class="boot-head">
        <div class="boot-brand">
          <div class="boot-mark">
            <svg class="boot-orbit" viewBox="0 0 38 38">
              <rect x="1" y="1" width="36" height="36" rx="9.5" />
            </svg>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <path d="M12 2.5L14.3 9.7L21.5 12L14.3 14.3L12 21.5L9.7 14.3L2.5 12L9.7 9.7L12 2.5Z" fill="currentColor" style="color: var(--accent);" />
            </svg>
          </div>
          <div>
            <div class="boot-title">Agent MCP</div>
            <div style="font-size:11.5px;color:var(--muted);margin-top:1px;">Control Plane</div>
          </div>
        </div>
        <span class="boot-tag">v3.1</span>
      </div>
      <div class="boot-bar"><div class="boot-bar-fill"></div></div>
      <div class="boot-foot">
        <div class="boot-step">
          <span class="boot-dot"></span>
          <span id="mcp-boot-msg">连接控制平面...</span>
        </div>
        <span class="boot-elapsed" id="mcp-boot-ms">0.0s</span>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var steps = ['连接控制平面...', '同步实时调用流...', '挂载工作台界面...'];
      var idx = 0;
      var t0 = performance.now();
      var msgEl = document.getElementById('mcp-boot-msg');
      var msEl = document.getElementById('mcp-boot-ms');
      var timer = setInterval(function () {
        if (msEl) {
          msEl.textContent = ((performance.now() - t0) / 1000).toFixed(1) + 's';
        }
      }, 100);
      var stepTimer = setInterval(function () {
        idx = (idx + 1) % steps.length;
        if (msgEl) msgEl.textContent = steps[idx];
      }, 950);
      window.addEventListener('flutter-first-frame', function () {
        clearInterval(timer);
        clearInterval(stepTimer);
        var boot = document.getElementById('mcp-boot');
        if (boot) {
          boot.classList.add('done');
          setTimeout(function () { boot.remove(); }, 280);
        }
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
