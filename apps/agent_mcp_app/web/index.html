<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Agent MCP Console — Cross-Device Remote Execution & MCP Control Plane">
  <meta name="theme-color" content="#FAF9F6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111317" media="(prefers-color-scheme: dark)">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Agent MCP">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <link rel="preload" href="assets/assets/fonts/AnthropicSerif-Medium.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="assets/assets/fonts/AnthropicSans-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="assets/assets/fonts/JetBrainsMono-Regular.ttf" as="font" type="font/ttf" crossorigin>

  <title>Agent MCP Console</title>

  <style>
    :root {
      --bg: #FAF9F6;
      --bg-glow-1: rgba(79, 70, 229, 0.08);
      --bg-glow-2: rgba(99, 102, 241, 0.06);
      --ink: #121316;
      --muted: #646873;
      --accent: #4F46E5;
      --accent-soft: #6366F1;
      --track: rgba(79, 70, 229, 0.14);
      --ring: rgba(79, 70, 229, 0.22);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111317;
        --bg-glow-1: rgba(99, 102, 241, 0.16);
        --bg-glow-2: rgba(79, 70, 229, 0.10);
        --ink: #F4F5F7;
        --muted: #8E93A0;
        --accent: #6366F1;
        --accent-soft: #818CF8;
        --track: rgba(129, 140, 248, 0.18);
        --ring: rgba(129, 140, 248, 0.28);
      }
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: var(--bg);
      color: var(--ink);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    #mcp-boot {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background:
        radial-gradient(520px 360px at 22% 18%, var(--bg-glow-1), transparent 70%),
        radial-gradient(480px 340px at 78% 82%, var(--bg-glow-2), transparent 70%),
        var(--bg);
      transition: opacity 320ms cubic-bezier(0.16, 1, 0.3, 1), transform 320ms cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }
    #mcp-boot.done {
      opacity: 0;
      transform: scale(1.025);
    }
    .mcp-emblem-wrap {
      position: relative;
      width: 68px;
      height: 68px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .mcp-emblem-ring {
      position: absolute;
      inset: -6px;
      border-radius: 24px;
      border: 1.5px solid var(--ring);
      background: radial-gradient(circle, rgba(79, 70, 229, 0.18) 0%, rgba(79, 70, 229, 0) 72%);
      animation: ringPulse 2.0s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .mcp-emblem {
      position: relative;
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: linear-gradient(135deg, #4F46E5 0%, #3730A3 55%, #1E1B4B 100%);
      box-shadow: 0 12px 28px -8px rgba(67, 56, 202, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.24);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: emblemFloat 2.0s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .mcp-spark {
      width: 28px;
      height: 28px;
    }
    .mcp-boot-label {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--ink);
    }
    .mcp-boot-bar {
      width: 176px;
      height: 3.5px;
      border-radius: 999px;
      background-color: var(--track);
      overflow: hidden;
      position: relative;
    }
    .mcp-boot-bar-fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: 44%;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(99, 102, 241, 0.15), var(--accent), var(--accent-soft), rgba(99, 102, 241, 0.15));
      animation: bootSlide 1.35s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .mcp-boot-sub {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.01em;
    }
    @keyframes emblemFloat {
      0%, 100% { transform: translateY(0px) scale(0.98); }
      50% { transform: translateY(-2.5px) scale(1.02); }
    }
    @keyframes ringPulse {
      0%, 100% { transform: scale(0.92); opacity: 0.45; }
      50% { transform: scale(1.12); opacity: 0.95; }
    }
    @keyframes bootSlide {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(250%); }
    }
  </style>
</head>
<body>
  <div id="mcp-boot">
    <div class="mcp-emblem-wrap">
      <div class="mcp-emblem-ring"></div>
      <div class="mcp-emblem" style="padding:0;overflow:hidden;background:transparent;">
        <img src="icons/Icon-192.png" alt="Agent MCP" style="width:100%;height:100%;display:block;border-radius:16px;" />
      </div>
    </div>
    <div class="mcp-boot-label">Agent MCP Console</div>
    <div class="mcp-boot-bar"><div class="mcp-boot-bar-fill"></div></div>
    <div class="mcp-boot-sub">正在初始化控制台与实时事件流...</div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('mcp-boot');
      if (boot) {
        boot.classList.add('done');
        setTimeout(function () { boot.remove(); }, 320);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
